<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>重点竞品监控清单 · 可编辑版</title></head>
<body style="margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#657083"><div id="loading" style="padding:48px;text-align:center">正在加载竞品监控清单…</div>
<script>
(async()=>{
const frozen='https://raw.githubusercontent.com/sunjinyang52-eng/wz-monitor-site/c755f41c15f6223ee7ecd292f044acbe0e138ed1/competitor-monitor-editable.html';
const patch=String.raw`
/* yimengjianghu-node-card-v1 */
(function(){
  if(document.getElementById('section-yimeng')) return;
  const main=document.querySelector('.content-main');
  if(!main) return;
  const card=document.createElement('section');
  card.className='card node-card';
  card.id='section-yimeng';
  card.innerHTML=
    '<div class="card-head"><div class="node-head-copy"><div class="title">12. 一梦江湖 · 版本节点 / 重点联动</div><div class="node-sub">重点跟踪未来大版本、系统级玩法与高体量联动；官方预研中的重大玩法也保留观察。</div></div><div class="meta"><span>截至 2026/9/17</span></div></div>'+
    '<div class="table-wrap"><table class="node-table"><thead><tr><th>时间</th><th>节点名称</th><th>类型</th><th>重点关注</th><th>信息状态</th></tr></thead><tbody>'+
    '<tr><td class="time">2026/10/9</td><td class="node-name">平行服二周年版本「长风筵」</td><td><span class="node-type version">版本节点</span></td><td class="node-copy">平行服二周年大版本：89级永久等级上限、成长与数值体系精简；新增平行逸闻、全服海上推理事件、3V3「金戈鸣沙」、高难玩法「凌渊」及帮派玩法「悍客临门」等。</td><td><span class="node-status confirmed">已官宣</span></td></tr>'+
    '<tr><td class="time">2026/10/9</td><td class="node-name">一梦江湖 × 丝绸之路大型文化联动</td><td><span class="node-type collab">重点联动</span></td><td class="node-copy">与中国文物交流中心合作，包含主题剧情、联动玩法与时装等内容；重点关注文化IP如何与剧情、玩法和商业化内容结合。</td><td><span class="node-status confirmed">已官宣</span></td></tr>'+
    '<tr><td class="time">时间未定</td><td class="node-name">经典服势力战</td><td><span class="node-type version">版本节点</span></td><td class="node-copy">官方已透露经典服势力战开启预研，具体上线时间与规则尚未公布。重点关注势力对抗规则、阵营生态及是否形成长期赛季化玩法。</td><td><span class="node-status preview">官方预告</span></td></tr>'+
    '</tbody></table></div><div class="node-legend">未来重大信息可提前收录：已定档内容标已官宣；官方已透露但日期/细节未完整公布的内容标官方预告；仅社区或爆料线索则标未证实爆料。</div>';
  main.appendChild(card);

  const nav=document.querySelector('.side-nav');
  if(nav && !nav.querySelector('a[href="#section-yimeng"]')){
    const a=document.createElement('a');
    a.href='#section-yimeng';
    a.innerHTML='<span class="nav-dot"></span>一梦江湖';
    a.addEventListener('click',()=>{nav.querySelectorAll('a').forEach(x=>x.classList.remove('active'));a.classList.add('active')});
    nav.appendChild(a);
  }
  if(typeof renderEditableNodes==='function') renderEditableNodes();
})();
`;
try{
  const res=await fetch(frozen,{cache:'no-store'});
  if(!res.ok) throw new Error('基础页面加载失败 '+res.status);
  let html=await res.text();
  const m=html.match(/const addonB64='([^']+)';/);
  if(!m) throw new Error('未找到页面扩展模块');
  const bin=atob(m[1]);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  let addon=new TextDecoder().decode(bytes);
  addon+='\n'+patch+'\n';
  const outBytes=new TextEncoder().encode(addon);
  let outBin='';
  const chunk=0x8000;
  for(let i=0;i<outBytes.length;i+=chunk) outBin+=String.fromCharCode(...outBytes.subarray(i,i+chunk));
  const nextB64=btoa(outBin);
  html=html.replace(m[0],"const addonB64='"+nextB64+"';");
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='页面加载失败：'+e.message;}
})();
</script></body></html>
