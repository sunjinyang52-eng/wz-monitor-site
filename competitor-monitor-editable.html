<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>重点竞品监控清单 · 可编辑版</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1c2536;--muted:#788395;--line:#e6ebf2;--blue:#3974f6;--blue-soft:#edf4ff;--green:#239f69;--green-soft:#eaf8f1;--red:#e34d58;--red-soft:#fff0f2;--amber:#d99000;--amber-soft:#fff6df;--purple:#7158c9;--purple-soft:#f2efff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.page{max-width:1680px;margin:0 auto;padding:30px 36px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:800}.sub{font-size:14px;color:var(--muted)}.update,.status{font-size:13px;color:#657083;background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:9px;white-space:nowrap}.status.ok{color:var(--green);background:var(--green-soft)}.status.warn{color:#a56a00;background:#fff8e8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(39,54,85,.05);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}.title{font-size:19px;font-weight:800}.meta{display:flex;align-items:center;gap:10px;color:#7b8596;font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:#5f6a7b;font-size:13px;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:5px 9px;font-size:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#fafbfd;color:#687386;font-size:13px;font-weight:700;text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}td{font-size:13px;padding:12px 12px;border-bottom:1px solid #edf1f6;vertical-align:middle;line-height:1.55;overflow-wrap:anywhere}th:nth-child(1),td:nth-child(1){width:9%}th:nth-child(2),td:nth-child(2){width:13%}th:nth-child(3),td:nth-child(3){width:24%}th:nth-child(4),td:nth-child(4){width:8%}th:nth-child(5),td:nth-child(5){width:6%}th:nth-child(6),td:nth-child(6){width:6%}th:nth-child(7),td:nth-child(7){width:16%}th:nth-child(8),td:nth-child(8){width:11%}th:nth-child(9),td:nth-child(9){width:7%}th:last-child,td:last-child{position:sticky;right:0;z-index:2;background:#fff}thead th:last-child{z-index:4;background:#fafbfd}tbody tr:hover td{background:#fbfdff}
.game{font-size:14px;font-weight:750;color:#20283a;white-space:nowrap}.service{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 7px;font-weight:700;font-size:12px;background:var(--blue-soft);color:#3c70df}.tag.sim{background:#eaf8f1;color:#298a62}.tag.race{background:#fff2e5;color:#bd681c}.tag.general{background:var(--purple-soft);color:var(--purple)}.reason{color:#4f5b6e}.focus{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:var(--green-soft);color:var(--green);white-space:nowrap}.focus.off{background:#f0f2f5;color:#7d8795}.level{display:inline-flex;justify-content:center;min-width:34px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.S{background:var(--red-soft);color:var(--red)}.A{background:var(--blue-soft);color:var(--blue)}.Bp{background:var(--amber-soft);color:var(--amber)}.other{background:#f2f3f5;color:#6c7480}.time{font-weight:650;color:#3f4858}.pending{color:#9aa3b2;font-weight:500}.note-cell{color:#6b7280}.note-empty{color:#b1b8c2}.actions{display:flex;gap:6px;white-space:nowrap;flex-wrap:wrap}.play-link{display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;border:1px solid #d9e5ff;background:#f5f8ff;color:#3974f6;border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700}.play-link:hover{background:#edf4ff}.link-help{font-size:10px;color:#9aa3b2;margin-top:4px}.note-bar{padding:13px 20px;background:#fcfdff;color:#8a94a4;font-size:12px}.setup{margin-bottom:14px;padding:12px 14px;border:1px solid #f1d9a3;background:#fff9ea;border-radius:10px;color:#8b630a;font-size:13px;display:none}
input,select,textarea{width:100%;min-width:0;border:1px solid #dfe5ec;border-radius:7px;padding:7px 8px;font:inherit;color:var(--text);background:#fff}textarea{min-height:62px;resize:vertical}.edit-row td{background:#fbfdff}.edit-row td:last-child{background:#fbfdff}.modal-backdrop{position:fixed;inset:0;background:rgba(24,33,50,.28);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(760px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(25,35,50,.2);padding:22px}.modal h2{margin:0 0 18px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#697386;margin-bottom:6px;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#20283a;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(8px);transition:.18s;z-index:30}.toast.show{opacity:1;transform:none}
@media(max-width:1250px){.page{padding:20px 14px 36px}table{min-width:1200px}}@media(max-width:900px){.top{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="top"><div><h1>重点竞品监控清单</h1><div class="sub">服务蛋仔派对 / 王牌竞速 / 模拟经营 / 非对称玩法的竞品观察</div></div><div class="top-right"><div id="syncStatus" class="status warn">连接共享数据中…</div><div id="updateTime" class="update">数据更新时间：--</div></div></div>
  <div id="setupHint" class="setup"></div>
  <section class="card"><div class="card-head"><div class="title">1. 上线竞品</div><div class="meta"><span id="countText">当前关注 -- 款</span><button class="btn primary" id="addBtn">＋ 新增竞品</button></div></div><div class="table-wrap"><table><thead><tr><th>竞品名字</th><th>服务类型</th><th>关注原因</th><th>玩法链接</th><th>是否关注</th><th>关注等级</th><th>时间</th><th>备注</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="note-bar">按 S → A → B+ → B → C 自动排序；玩法链接可手动编辑，清空后保存即可删除；保存后所有人看到同一份数据。</div></section>
</div>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h2>新增竞品</h2><div class="grid"><div class="field"><label>竞品名字</label><input id="m_game_name"></div><div class="field"><label>服务大类</label><select id="m_service_group"><option>蛋仔</option><option>模拟经营</option><option>王牌竞速</option><option>综合参考</option></select></div><div class="field"><label>服务类型</label><input id="m_service_type"></div><div class="field"><label>关注等级</label><select id="m_level" translate="no" class="notranslate"><option>S</option><option selected>A</option><option>B+</option><option>B</option><option>C</option></select></div><div class="field full"><label>关注原因</label><textarea id="m_reason"></textarea></div><div class="field full"><label>玩法链接</label><input id="m_gameplay_link" placeholder="可留空；留空时默认 B站玩法搜索"></div><div class="field"><label>是否关注</label><select id="m_focus"><option value="true">关注</option><option value="false">不关注</option></select></div><div class="field"><label>时间</label><input id="m_event_time" value="下一节点未公布"></div><div class="field full"><label>备注</label><textarea id="m_note" placeholder="可留空"></textarea></div></div><div class="modal-actions"><button class="btn" id="cancelAdd">取消</button><button class="btn primary" id="saveAdd">保存新增</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://fzkrcnrxwvpcuexrbptz.supabase.co';
const SUPABASE_KEY='sb_publishable_bBnwtvGMze6BxiHV2m_SZg_iyUS7W_F';
const TABLE='competitors';
const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
const levelOrder={S:0,A:1,'B+':2,B:3,C:4};
const FIVE_STAR_LINK='https://www.bilibili.com/video/BV1C1HfzGEEk/?spm_id_from=333.337.search-card.all.click';
const NO_LINK='__NONE__';
let rows=[];let editingId=null;
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tagClass(g){return g==='模拟经营'?'sim':g==='王牌竞速'?'race':g==='综合参考'?'general':''}
function levelClass(v){return v==='S'?'S':v==='A'?'A':v==='B+'?'Bp':'other'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2100)}
function isGtaName(n=''){const x=String(n).toLowerCase().replace(/\s+/g,'');return x==='gta6'||x==='gat6'||x==='grandtheftautovi'}
function gtaScore(r){let s=0;if(/2026\/11\/19/.test(r.event_time||''))s+=5;if(!/2016\/11\/19/.test(r.event_time||''))s+=2;if(/^gta6$/i.test((r.game_name||'').trim()))s+=1;return s}
function fallbackGameplayUrl(name=''){if(name==='五星好市民')return FIVE_STAR_LINK;const q=(isGtaName(name)?'GTA6':name)+' 实机 玩法';return 'https://search.bilibili.com/all?keyword='+encodeURIComponent(q)}
function gameplayUrl(r){const raw=String(r.gameplay_link||'').trim();if(raw===NO_LINK)return '';return raw||fallbackGameplayUrl(r.game_name)}
function editGameplayValue(r){const raw=String(r.gameplay_link||'').trim();if(raw===NO_LINK)return '';return raw||fallbackGameplayUrl(r.game_name)}
function normalizeAndSort(list){const gta=list.filter(r=>isGtaName(r.game_name));const rest=list.filter(r=>!isGtaName(r.game_name));if(gta.length){const chosen=[...gta].sort((a,b)=>gtaScore(b)-gtaScore(a))[0];rest.push({...chosen,game_name:'GTA6',service_group:'综合参考',service_type:'都市开放世界 / 载具',reason:chosen.reason||'全球头部开放世界IP，新作临近上线，重点关注城市开放世界、载具、内容密度与市场热度。',event_time:'2026/11/19 PS5 / Xbox Series X|S 上线',level:'S'});}return rest.sort((a,b)=>(levelOrder[a.level]??99)-(levelOrder[b.level]??99)||(Number(a.sort_order)||9999)-(Number(b.sort_order)||9999)||(Number(a.id)||0)-(Number(b.id)||0))}
function yearify(text=''){if(!text||text==='下一节点未公布')return text;return String(text).replace(/(^|[\s｜、，,；;])(\d{1,2}\/\d{1,2})/g,'$12026/$2')}
async function load(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*`,{headers});if(!r.ok)throw new Error(await r.text());rows=normalizeAndSort(await r.json());syncStatus.textContent='共享数据已连接';syncStatus.className='status ok';setupHint.style.display='none';const max=rows.map(x=>x.updated_at).filter(Boolean).sort().pop();updateTime.textContent='数据更新时间：'+(max?new Date(max).toLocaleString('zh-CN',{hour12:false}):'--');render();}catch(e){syncStatus.textContent='连接失败';syncStatus.className='status warn';setupHint.style.display='block';setupHint.textContent='数据库连接失败：'+e.message;}}
function render(){tbody.innerHTML='';rows.forEach(r=>tbody.appendChild(editingId===r.id?editRow(r):viewRow(r)));countText.textContent=`当前关注 ${rows.filter(r=>r.focus).length} 款`;}
function viewRow(r){const tr=document.createElement('tr');const shownTime=yearify(r.event_time);const link=gameplayUrl(r);const linkCell=link?`<a class="play-link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${String(r.gameplay_link||'').trim()&&!isGtaName(r.game_name)?'玩法直达':'B站玩法'}</a>`:'<span class="note-empty">—</span>';tr.innerHTML=`<td class="game">${esc(r.game_name)}</td><td><span class="service"><span class="tag ${tagClass(r.service_group)}">${esc(r.service_group)}</span> ${esc(r.service_type)}</span></td><td class="reason">${esc(r.reason)}</td><td>${linkCell}</td><td><span class="focus ${r.focus?'':'off'}">${r.focus?'关注':'不关注'}</span></td><td><span class="level ${levelClass(r.level)} notranslate" translate="no">${esc(r.level)}</span></td><td class="time ${shownTime==='下一节点未公布'?'pending':''}">${esc(shownTime)}</td><td class="note-cell">${r.note?esc(r.note):'<span class="note-empty">—</span>'}</td><td><button class="btn small" data-edit>编辑</button></td>`;tr.querySelector('[data-edit]').onclick=()=>{editingId=r.id;render()};return tr;}
function editRow(r){const tr=document.createElement('tr');tr.className='edit-row';tr.innerHTML=`<td><input data-k="game_name" value="${esc(r.game_name)}"></td><td><div style="display:grid;grid-template-columns:96px 1fr;gap:6px"><select data-k="service_group">${['蛋仔','模拟经营','王牌竞速','综合参考'].map(x=>`<option ${x===r.service_group?'selected':''}>${x}</option>`).join('')}</select><input data-k="service_type" value="${esc(r.service_type)}"></div></td><td><textarea data-k="reason">${esc(r.reason)}</textarea></td><td><input data-k="gameplay_link" value="${esc(editGameplayValue(r))}" placeholder="粘贴链接"><div class="link-help">清空并保存 = 删除链接</div></td><td><select data-k="focus"><option value="true" ${r.focus?'selected':''}>关注</option><option value="false" ${!r.focus?'selected':''}>不关注</option></select></td><td><select data-k="level" translate="no" class="notranslate">${['S','A','B+','B','C'].map(x=>`<option ${x===r.level?'selected':''}>${x}</option>`).join('')}</select></td><td><input data-k="event_time" value="${esc(yearify(r.event_time))}"></td><td><textarea data-k="note" placeholder="如：已测试，无需再看">${esc(r.note||'')}</textarea></td><td><div class="actions"><button class="btn small primary" data-save>保存</button><button class="btn small" data-cancel>取消</button></div></td>`;tr.querySelector('[data-cancel]').onclick=()=>{editingId=null;render()};tr.querySelector('[data-save]').onclick=()=>saveRow(r,tr);return tr;}
async function saveRow(r,tr){const obj={};tr.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;if(k==='focus')obj[k]=el.value==='true';else if(k==='gameplay_link')obj[k]=el.value.trim()||NO_LINK;else obj[k]=el.value.trim()});obj.updated_at=new Date().toISOString();const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(r.id)}`,{method:'PATCH',headers:{...headers,'Prefer':'return=representation'},body:JSON.stringify(obj)});if(!res.ok){const txt=await res.text();toast(txt.includes('gameplay_link')?'玩法链接字段还没初始化':'保存失败');return}editingId=null;toast('已保存，所有人都能看到');await load();}
addBtn.onclick=()=>modalBackdrop.style.display='flex';cancelAdd.onclick=()=>modalBackdrop.style.display='none';saveAdd.onclick=async()=>{const name=m_game_name.value.trim();if(!name){toast('先填竞品名字');return}if(isGtaName(name)&&rows.some(r=>isGtaName(r.game_name))){toast('GTA6 已经在清单里');return}const obj={game_name:name,service_group:m_service_group.value,service_type:m_service_type.value.trim(),reason:m_reason.value.trim(),gameplay_link:m_gameplay_link.value.trim(),focus:m_focus.value==='true',level:m_level.value,event_time:m_event_time.value.trim()||'下一节点未公布',note:m_note.value.trim(),sort_order:Math.max(0,...rows.map(x=>Number(x.sort_order)||0))+1,updated_at:new Date().toISOString()};const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{...headers,'Prefer':'return=representation'},body:JSON.stringify(obj)});if(!res.ok){const txt=await res.text();toast(txt.includes('gameplay_link')?'玩法链接字段还没初始化':'新增失败');return}modalBackdrop.style.display='none';['m_game_name','m_service_type','m_reason','m_gameplay_link','m_note'].forEach(id=>document.getElementById(id).value='');m_event_time.value='下一节点未公布';toast('已新增');await load();};
load();setInterval(()=>{if(!editingId)load()},30000);
</script>
</body>
</html>
