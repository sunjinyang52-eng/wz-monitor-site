<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>重点竞品监控清单 · 可编辑版</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1c2536;--muted:#788395;--line:#e6ebf2;--blue:#3974f6;--blue-soft:#edf4ff;--green:#239f69;--green-soft:#eaf8f1;--red:#e34d58;--red-soft:#fff0f2;--amber:#d99000;--amber-soft:#fff6df;--purple:#7158c9;--purple-soft:#f2efff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.page{max-width:1680px;margin:0 auto;padding:30px 36px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.top-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:800}.sub{font-size:14px;color:var(--muted)}.update,.status{font-size:13px;color:#657083;background:white;border:1px solid var(--line);padding:9px 13px;border-radius:9px;white-space:nowrap}.status.ok{color:var(--green);background:var(--green-soft)}.status.warn{color:#a56a00;background:#fff8e8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(39,54,85,.05);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}.title{font-size:19px;font-weight:800}.meta{display:flex;align-items:center;gap:10px;color:#7b8596;font-size:13px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:#5f6a7b;font-size:13px;cursor:pointer}.btn:hover{background:#f8fafc}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:5px 9px;font-size:12px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1550px}th{background:#fafbfd;color:#687386;font-size:13px;font-weight:700;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}td{font-size:13px;padding:12px 14px;border-bottom:1px solid #edf1f6;vertical-align:middle;line-height:1.55}tbody tr:hover{background:#fbfdff}.game{font-size:14px;font-weight:750;color:#20283a;white-space:nowrap}.service{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 7px;font-weight:700;font-size:12px;background:var(--blue-soft);color:#3c70df}.tag.sim{background:#eaf8f1;color:#298a62}.tag.race{background:#fff2e5;color:#bd681c}.tag.general{background:var(--purple-soft);color:var(--purple)}.reason{color:#4f5b6e;max-width:390px}.focus{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700;background:var(--green-soft);color:var(--green)}.focus.off{background:#f0f2f5;color:#7d8795}.level{display:inline-flex;justify-content:center;min-width:34px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.S{background:var(--red-soft);color:var(--red)}.A{background:var(--blue-soft);color:var(--blue)}.Bp{background:var(--amber-soft);color:var(--amber)}.other{background:#f2f3f5;color:#6c7480}.time{font-weight:650;color:#3f4858;white-space:nowrap}.pending{color:#9aa3b2;font-weight:500}.note-cell{color:#6b7280;min-width:180px}.note-empty{color:#b1b8c2}.actions{display:flex;gap:6px;white-space:nowrap}.note-bar{padding:13px 20px;background:#fcfdff;color:#8a94a4;font-size:12px}.setup{margin-bottom:14px;padding:12px 14px;border:1px solid #f1d9a3;background:#fff9ea;border-radius:10px;color:#8b630a;font-size:13px;display:none}
input,select,textarea{width:100%;border:1px solid #dfe5ec;border-radius:7px;padding:7px 8px;font:inherit;color:var(--text);background:#fff}textarea{min-height:62px;resize:vertical}.edit-row td{background:#fbfdff}.modal-backdrop{position:fixed;inset:0;background:rgba(24,33,50,.28);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(720px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(25,35,50,.2);padding:22px}.modal h2{margin:0 0 18px;font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:#697386;margin-bottom:6px;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:22px;bottom:22px;background:#20283a;color:#fff;padding:10px 14px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(8px);transition:.18s;z-index:30}.toast.show{opacity:1;transform:none}
@media(max-width:900px){.page{padding:20px 14px}.top{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div><h1>重点竞品监控清单</h1><div class="sub">服务蛋仔派对 / 王牌竞速 / 模拟经营 / 非对称玩法的竞品观察</div></div>
    <div class="top-right"><div id="syncStatus" class="status warn">等待连接共享数据</div><div id="updateTime" class="update">数据更新时间：--</div></div>
  </div>
  <div id="setupHint" class="setup">可编辑版已经准备好，但还差 Supabase 的 publishable key。连接后，任何人都可以直接编辑并保存，其他人刷新即可看到最新内容。</div>
  <section class="card">
    <div class="card-head"><div class="title">1. 上线竞品</div><div class="meta"><span id="countText">当前关注 18 款</span><button class="btn primary" id="addBtn">＋ 新增竞品</button></div></div>
    <div class="table-wrap"><table><thead><tr><th>竞品名字</th><th>服务类型</th><th>关注原因</th><th>是否关注</th><th>关注等级</th><th>时间</th><th>备注</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></div>
    <div class="note-bar">每行都可直接编辑；备注可填写“已测试，无需再看”“等待下一测试”等信息。保存后写入共享数据库。</div>
  </section>
</div>
<div id="modalBackdrop" class="modal-backdrop"><div class="modal"><h2>新增竞品</h2><div class="grid"><div class="field"><label>竞品名字</label><input id="m_game_name"></div><div class="field"><label>服务大类</label><select id="m_service_group"><option>蛋仔</option><option>模拟经营</option><option>王牌竞速</option><option>综合参考</option></select></div><div class="field"><label>服务类型</label><input id="m_service_type"></div><div class="field"><label>关注等级</label><select id="m_level"><option>S</option><option selected>A</option><option>B+</option><option>B</option><option>C</option></select></div><div class="field full"><label>关注原因</label><textarea id="m_reason"></textarea></div><div class="field"><label>是否关注</label><select id="m_focus"><option value="true">关注</option><option value="false">不关注</option></select></div><div class="field"><label>时间</label><input id="m_event_time" value="下一节点未公布"></div><div class="field full"><label>备注</label><textarea id="m_note" placeholder="可留空"></textarea></div></div><div class="modal-actions"><button class="btn" id="cancelAdd">取消</button><button class="btn primary" id="saveAdd">保存新增</button></div></div></div>
<div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://fzkrcnrxwvpcuexrbptz.supabase.co';const SUPABASE_KEY='PASTE_PUBLISHABLE_KEY_HERE';const TABLE='competitors';const connected=!SUPABASE_KEY.includes('PASTE_');const headers=connected?{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}:{};let rows=[];let editingId=null;
const fallbackRows=[{game_name:'王者万象棋',service_group:'蛋仔',service_type:'自走棋',reason:'蛋仔已有对应自走棋玩法，可参考局内结构、养成节奏和随机事件。',focus:true,level:'S',event_time:'9/10 正式上线',note:'',sort_order:1},{game_name:'星布谷地',service_group:'模拟经营',service_type:'生活模拟 / 社交',reason:'米哈游生活模拟项目，重点观察种田、经营、社交和长期养成。',focus:true,level:'S',event_time:'9/20 测试｜冬季公测',note:'',sort_order:2},{game_name:'无限大',service_group:'综合参考',service_type:'都市开放世界',reason:'网易都市开放世界项目，市场关注度高，关注开放世界内容组织与多人体验。',focus:true,level:'S',event_time:'2027/1/15 全球上线',note:'',sort_order:3},{game_name:'粒粒的小人国',service_group:'模拟经营',service_type:'建造 / 社交',reason:'腾讯模拟经营、建造和社交新品，重点观察泛休闲用户体验与多人社交设计。',focus:true,level:'S',event_time:'9/22 测试',note:'',sort_order:4},{game_name:'伊莫',service_group:'蛋仔',service_type:'抓宠 / 开放世界',reason:'开放世界+抓宠题材，重点观察探索、收集和宠物养成体验。',focus:true,level:'S',event_time:'9/23 移动端上线',note:'',sort_order:5},{game_name:'蓝色星原：旅谣',service_group:'蛋仔',service_type:'抓宠 / 养成',reason:'二次元开放世界+养成收集，重点观察大世界探索和长期养成体验。',focus:true,level:'S',event_time:'9/17 测试',note:'',sort_order:6},{game_name:'望月',service_group:'蛋仔',service_type:'抓宠 / 开放世界',reason:'都市开放世界+抓宠+建造，重点观察探索、宠物与自由玩法结构。',focus:true,level:'S',event_time:'2026 Q4 PC测试',note:'',sort_order:7},{game_name:'崩坏：因缘精灵',service_group:'蛋仔',service_type:'抓宠 / 自走棋',reason:'宠物养成与自走棋结合，可参考抓宠体系和局内策略结构。',focus:true,level:'S',event_time:'下一节点未公布',note:'',sort_order:8},{game_name:'代号：梦核',service_group:'蛋仔',service_type:'多人恐怖 / 撤离',reason:'内部已体验测试，当前重点关注多人恐怖、探索与撤离体验。',focus:true,level:'S',event_time:'下一节点未公布',note:'',sort_order:9},{game_name:'Varsapura',service_group:'王牌竞速',service_type:'都市开放世界 / 载具',reason:'米哈游都市开放世界项目，重点观察城市空间、载具体验和开放世界内容组织。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:10},{game_name:'源初之结',service_group:'综合参考',service_type:'动作 / 冒险',reason:'米哈游新项目，关注后续产品方向、玩法信息和测试节点。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:11},{game_name:'雾海之下',service_group:'蛋仔',service_type:'多人搜打撤',reason:'网易项目，多人搜打撤方向，首曝内容外部播放表现较高。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:12},{game_name:'闪耀吧！噜咪',service_group:'模拟经营',service_type:'抓宠 / 经营',reason:'抓宠+模拟经营，重点观察宠物养成和轻量经营循环。',focus:true,level:'A',event_time:'9/17 正式公测',note:'',sort_order:13},{game_name:'龙岛异兽起源',service_group:'蛋仔',service_type:'开放世界 / 生存',reason:'恐龙+开放世界生存题材，重点观察角色形态、探索和多人生态。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:14},{game_name:'诡影藏锋',service_group:'蛋仔',service_type:'中式题材 / 搜打撤',reason:'网易项目，中式题材+搜打撤，重点观察题材包装和局内循环。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:15},{game_name:'头号禁区',service_group:'蛋仔',service_type:'搜打撤 / MOBA',reason:'搜打撤+MOBA组合相对少见，具备较强玩法研究价值。',focus:true,level:'A',event_time:'2026 Q4 上线',note:'',sort_order:16},{game_name:'五星好市民',service_group:'综合参考',service_type:'多人开放世界',reason:'像素风多人开放世界，重点观察多人互动、探索和自由玩法结构。',focus:true,level:'A',event_time:'下一节点未公布',note:'',sort_order:17},{game_name:'代号：Lovania',service_group:'模拟经营',service_type:'种田 / 社交 / 多人',reason:'生活模拟+种田+社交方向与重点赛道相关，保留观察。',focus:true,level:'B+',event_time:'10/2–10/6 线下参展',note:'',sort_order:18}];
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function tagClass(g){return g==='模拟经营'?'sim':g==='王牌竞速'?'race':g==='综合参考'?'general':''}function levelClass(v){return v==='S'?'S':v==='A'?'A':v==='B+'?'Bp':'other'}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
async function load(){if(!connected){rows=fallbackRows.map((r,i)=>({...r,id:'local-'+i}));setupHint.style.display='block';syncStatus.textContent='预览模式';render();return;}try{const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=sort_order.asc,id.asc`,{headers});if(!r.ok)throw new Error(await r.text());rows=await r.json();syncStatus.textContent='共享数据已连接';syncStatus.className='status ok';const max=rows.map(x=>x.updated_at).filter(Boolean).sort().pop();updateTime.textContent='数据更新时间：'+(max?new Date(max).toLocaleString('zh-CN',{hour12:false}):'--');render();}catch(e){syncStatus.textContent='连接失败';setupHint.style.display='block';setupHint.textContent='数据库连接失败：'+e.message;rows=fallbackRows.map((r,i)=>({...r,id:'local-'+i}));render();}}
function render(){tbody.innerHTML='';rows.forEach(r=>tbody.appendChild(editingId===r.id?editRow(r):viewRow(r)));countText.textContent=`当前关注 ${rows.filter(r=>r.focus).length} 款`;}
function viewRow(r){const tr=document.createElement('tr');tr.innerHTML=`<td class="game">${esc(r.game_name)}</td><td><span class="service"><span class="tag ${tagClass(r.service_group)}">${esc(r.service_group)}</span> ${esc(r.service_type)}</span></td><td class="reason">${esc(r.reason)}</td><td><span class="focus ${r.focus?'':'off'}">${r.focus?'关注':'不关注'}</span></td><td><span class="level ${levelClass(r.level)}">${esc(r.level)}</span></td><td class="time ${r.event_time==='下一节点未公布'?'pending':''}">${esc(r.event_time)}</td><td class="note-cell">${r.note?esc(r.note):'<span class="note-empty">—</span>'}</td><td><button class="btn small" data-edit>编辑</button></td>`;tr.querySelector('[data-edit]').onclick=()=>{editingId=r.id;render()};return tr;}
function editRow(r){const tr=document.createElement('tr');tr.className='edit-row';tr.innerHTML=`<td><input data-k="game_name" value="${esc(r.game_name)}"></td><td><div style="display:grid;grid-template-columns:100px 1fr;gap:6px"><select data-k="service_group">${['蛋仔','模拟经营','王牌竞速','综合参考'].map(x=>`<option ${x===r.service_group?'selected':''}>${x}</option>`).join('')}</select><input data-k="service_type" value="${esc(r.service_type)}"></div></td><td><textarea data-k="reason">${esc(r.reason)}</textarea></td><td><select data-k="focus"><option value="true" ${r.focus?'selected':''}>关注</option><option value="false" ${!r.focus?'selected':''}>不关注</option></select></td><td><select data-k="level">${['S','A','B+','B','C'].map(x=>`<option ${x===r.level?'selected':''}>${x}</option>`).join('')}</select></td><td><input data-k="event_time" value="${esc(r.event_time)}"></td><td><textarea data-k="note" placeholder="如：已测试，无需再看">${esc(r.note||'')}</textarea></td><td><div class="actions"><button class="btn small primary" data-save>保存</button><button class="btn small" data-cancel>取消</button></div></td>`;tr.querySelector('[data-cancel]').onclick=()=>{editingId=null;render()};tr.querySelector('[data-save]').onclick=()=>saveRow(r,tr);return tr;}
async function saveRow(r,tr){if(!connected){toast('还没连接 Supabase，暂时不能共享保存');return}const obj={};tr.querySelectorAll('[data-k]').forEach(el=>obj[el.dataset.k]=el.dataset.k==='focus'?el.value==='true':el.value.trim());obj.updated_at=new Date().toISOString();const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(r.id)}`,{method:'PATCH',headers:{...headers,'Prefer':'return=representation'},body:JSON.stringify(obj)});if(!res.ok){toast('保存失败');return}editingId=null;toast('已保存，其他人刷新即可看到');await load();}
addBtn.onclick=()=>modalBackdrop.style.display='flex';cancelAdd.onclick=()=>modalBackdrop.style.display='none';saveAdd.onclick=async()=>{if(!connected){toast('还没连接 Supabase，暂时不能共享保存');return}const obj={game_name:m_game_name.value.trim(),service_group:m_service_group.value,service_type:m_service_type.value.trim(),reason:m_reason.value.trim(),focus:m_focus.value==='true',level:m_level.value,event_time:m_event_time.value.trim()||'下一节点未公布',note:m_note.value.trim(),sort_order:(Math.max(0,...rows.map(x=>Number(x.sort_order)||0))+1),updated_at:new Date().toISOString()};if(!obj.game_name){toast('先填竞品名字');return}const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{...headers,'Prefer':'return=representation'},body:JSON.stringify(obj)});if(!res.ok){toast('新增失败');return}modalBackdrop.style.display='none';toast('已新增');await load();};load();
</script>
</body>
</html>
