<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>重点竞品监控清单 · 可编辑版</title></head>
<body style="margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#657083"><div id="loading" style="padding:48px;text-align:center">正在加载竞品监控清单…</div>
<script>
(async()=>{
const frozen='https://raw.githubusercontent.com/sunjinyang52-eng/wz-monitor-site/1516f9f0514e92454402abcc9f43a8d1dfcb991e/competitor-monitor-editable.html';
const patch=String.raw`
/* season-cycle-audit-v1 */
(function(){
  function findRow(sectionId,namePart){
    const sec=document.getElementById(sectionId); if(!sec) return null;
    return Array.from(sec.querySelectorAll('.node-table tbody tr')).find(function(tr){
      const n=tr.querySelector('.node-name'); return n && n.textContent.indexOf(namePart)!==-1;
    })||null;
  }
  function patchRow(cfg){
    const tr=findRow(cfg.section,cfg.name); if(!tr) return;
    const c=tr.children; if(!c||c.length<5) return;
    const oldTime=(c[0].textContent||'').trim();
    const oldFocus=(c[3].textContent||'').trim();
    if(cfg.timeFrom && cfg.timeFrom.indexOf(oldTime)!==-1){ c[0].textContent=cfg.timeTo; tr.dataset.baseTime=cfg.timeTo; }
    if(cfg.focusFrom && cfg.focusFrom.indexOf(oldFocus)!==-1){ c[3].textContent=cfg.focusTo; tr.dataset.baseFocus=cfg.focusTo; }
  }
  function applySeasonAudit(){
    patchRow({section:'section-honor',name:'S46 新赛季',focusFrom:['关注下一赛季主题、新英雄、系统调整和玩法改动。'],focusTo:'近10个完整赛季平均约90天、中位数约90.5天，整体约3个月一轮；若S45于9/24开启，则S46预测落在12/23前后，具体日期以官宣为准。'});
    patchRow({section:'section-peace',name:'下一轮赛季切换',focusFrom:['关注新赛季主题、玩法内容及长期系统变化。'],focusTo:'近14个完整赛季平均约60.8天、中位数63天，整体约2个月一轮；若9/19完成本轮切换，则下一轮预测约11/21，具体以官宣为准。'});
    patchRow({section:'section-supernatural',name:'下一赛季',focusFrom:['按现有赛季周期推算，关注新赛季主题、玩法和联动安排。'],focusTo:'历史波动较大：S1约246天、S2约112天、S3约168天。S1为开服首赛季、明显偏长；仅参考最近S2/S3平均约140天，则S4自7/3起下一赛季预测约11/20。该预测置信度低于其他游戏，需持续等官方预告。'});
    patchRow({section:'section-identityv',name:'第四十六赛季',focusFrom:['按近期约70天一赛季的节奏推算，关注下一赛季主题和核心规则调整。'],focusTo:'近13个完整赛季平均约69.6天、中位数70天，整体约10周一轮；第四十五赛季已于9/10开启，据此第四十六赛季预测约11/19，具体以官宣为准。'});
    patchRow({section:'section-delta',name:'S12 下一赛季',timeFrom:['预计 2026/11/5'],timeTo:'预计 2026/11/14',focusFrom:['按 S11 公开周期推算，下一赛季预计11月初切换，主题与具体内容尚未公布。'],focusTo:'近10个完整赛季平均约70.8天、中位数约73.5天，整体约2～2.5个月一轮；S11于9/4开启，据此S12预测约11月中旬，暂以11/14作为周期参考点，具体以官宣为准。'});
    patchRow({section:'section-golden',name:'下一赛季',timeFrom:['预计 2026/11/5'],timeTo:'预计 2026/12 上旬',focusFrom:['第三方根据端游补丁排期推测「自然之力」约11月初结束，下一赛季主题尚未官宣。'],focusTo:'已撤销原11/5预测：该日期缺乏金铲铲手游自身周期支持。S18于8/20开启，结合手游主赛季约4个月的历史节奏及TFT Set 19窗口，暂估12月上旬；官方尚未定档。'});
  }
  applySeasonAudit();
  setTimeout(applySeasonAudit,300);
  setTimeout(applySeasonAudit,1200);
  if(typeof renderEditableNodes==='function'){
    const prev=renderEditableNodes;
    renderEditableNodes=function(){ prev(); setTimeout(applySeasonAudit,0); };
  }
})();
`;
try{
  const res=await fetch(frozen,{cache:'no-store'});
  if(!res.ok) throw new Error('基础页面加载失败 '+res.status);
  let html=await res.text();
  const marker='\n`;\ntry{';
  if(!html.includes(marker)) throw new Error('未找到扩展插入点');
  html=html.replace(marker,'\n'+patch+marker);
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='页面加载失败：'+e.message;}
})();
</script></body></html>
