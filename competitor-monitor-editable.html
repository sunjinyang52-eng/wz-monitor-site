  function findRow(sectionId,matcher){

    return Array.from(sec.querySelectorAll('.node-table tbody tr')).find(tr=>{const n=tr.querySelector('.node-name,.node-label');return n&&matcher((n.textContent||'').trim())})||null;
  }
  function setRow(sectionId,matcher,d){
    const tr=findRow(sectionId,matcher); if(!tr) return; const c=tr.children; if(!c||c.length<5) return;
    if(d.time!==undefined){c[0].textContent=d.time;tr.dataset.baseTime=d.time}
    if(d.name!==undefined){c[1].innerHTML='<span class="node-label">'+d.name+'</span>';tr.dataset.baseName=d.name}
    if(d.focus!==undefined){c[3].textContent=d.focus;tr.dataset.baseFocus=d.focus}

  function applyAudit(){

    setRow('section-golden',n=>n==='下一赛季',{time:'预计 2026/12月上旬',focus:'S18于8/20开启；结合金铲铲手游历史主赛季约4个月节奏及TFT Set 19赛事窗口，下一赛季暂预计12月上旬，具体日期待官方确认。',status:'周期预测'});

    const prevRender=render;

    render=wrappedRender;
  }
  applyCompetitorAudit();
  if(typeof render==='function') render();

  setTimeout(applyAudit,300); setTimeout(applyAudit,1200);

try{
  const res=await fetch(frozen,{cache:'no-store'});
  if(!res.ok) throw new Error('基础页面加载失败 '+res.status);
  let html=await res.text();
  const token="const addonB64='";
  const start=html.indexOf(token);
  if(start<0) throw new Error('未找到基础扩展模块');
  const b64Start=start+token.length;
  const b64End=html.indexOf("';",b64Start);
  if(b64End<0) throw new Error('基础扩展模块格式异常');
  const b64=html.slice(b64Start,b64End);
  if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)||b64.length%4!==0) throw new Error('基础扩展模块编码异常');
  const bin=atob(b64);
  const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
  let addon=new TextDecoder().decode(bytes);
  addon+='\n'+patch+'\n';
  const outBytes=new TextEncoder().encode(addon);
  let outBin=''; const chunk=0x8000;
  for(let i=0;i<outBytes.length;i+=chunk) outBin+=String.fromCharCode(...outBytes.subarray(i,i+chunk));
  const nextB64=btoa(outBin);
  html=html.slice(0,b64Start)+nextB64+html.slice(b64End);
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='页面加载失败：'+e.message;}
})();
