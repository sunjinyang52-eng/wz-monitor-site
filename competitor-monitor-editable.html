<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>重点竞品监控清单 · 可编辑版</title></head>
<body style="margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;color:#657083"><div id="loading" style="padding:48px;text-align:center">正在加载竞品监控清单…</div>
<script>
(async()=>{
const frozen='https://raw.githubusercontent.com/sunjinyang52-eng/wz-monitor-site/1516f9f0514e92454402abcc9f43a8d1dfcb991e/competitor-monitor-editable.html';
const patch=String.raw`
/* audited-node-patch-v2 */
(function(){
  function findRow(sectionId,namePart){
    const sec=document.getElementById(sectionId); if(!sec) return null;
    return Array.from(sec.querySelectorAll('.node-table tbody tr')).find(function(tr){
      const n=tr.querySelector('.node-name'); return n && n.textContent.indexOf(namePart)!==-1;
    })||null;
  }
  function statusClass(s){ return s==='已上线'||s==='已官宣'?'confirmed':s==='官方预告'?'preview':s==='周期预测'?'predicted':'rumor'; }
  function setStatus(td,s){ td.innerHTML='<span class="node-status '+statusClass(s)+'">'+s+'</span>'; }
  function updateRow(section,namePart,cfg){
    const tr=findRow(section,namePart); if(!tr) return null;
    const c=tr.children; if(c.length<5) return tr;
    if(cfg.time!==undefined){ c[0].textContent=cfg.time; tr.dataset.baseTime=cfg.time; }
    if(cfg.name!==undefined){ c[1].innerHTML='<span class="node-label">'+cfg.name+'</span>'; tr.dataset.baseName=cfg.name; }
    if(cfg.focus!==undefined){ c[3].textContent=cfg.focus; tr.dataset.baseFocus=cfg.focus; }
    if(cfg.status!==undefined){ setStatus(c[4],cfg.status); tr.dataset.baseStatus=cfg.status; }
    return tr;
  }
  function removeRow(section,namePart){ const tr=findRow(section,namePart); if(tr) tr.remove(); }
  function addRow(section,cfg){
    const sec=document.getElementById(section); if(!sec || findRow(section,cfg.name)) return;
    const body=sec.querySelector('.node-table tbody'); if(!body) return;
    const tr=document.createElement('tr'); tr.dataset.nodeAdded='1';
    const typeClass=cfg.type==='重点联动'?'collab':'version';
    tr.innerHTML='<td class="time">'+cfg.time+'</td><td class="node-name"><span class="node-label">'+cfg.name+'</span></td><td><span class="node-type '+typeClass+'">'+cfg.type+'</span></td><td class="node-copy">'+cfg.focus+'</td><td></td>';
    setStatus(tr.children[4],cfg.status); body.appendChild(tr);
  }
  function apply(){
    updateRow('section-honor','S45 新赛季',{time:'预计 2026/9/24',name:'S45 新赛季「月照长安」',focus:'官方已公开「月照长安」赛季主题及王维、雾行千山等内容；9/24仍按历史周期作为预计切换日，具体日期以官宣为准。',status:'官方预告'});
    updateRow('section-honor','S46 新赛季',{focus:'近10个完整赛季平均约90天、中位数约90.5天，整体约3个月一轮；若S45于9/24开启，则S46预测落在12/23前后，具体日期以官宣为准。'});
    updateRow('section-peace','下一赛季切换',{time:'2026/9/19',focus:'官方已明确新赛季9/19开启，关注段位重置、赛季任务、赛季奖励和玩法调整。',status:'已官宣'});
    updateRow('section-peace','下一轮赛季切换',{focus:'近14个完整赛季平均约60.8天、中位数63天，整体约2个月一轮；若9/19完成本轮切换，则下一轮预测约11/21，具体以官宣为准。'});
    updateRow('section-supernatural','下一赛季',{time:'预计 2026/11月下旬',focus:'历史波动较大：S1约246天、S2约112天、S3约168天。S1首赛季明显偏长；仅参考S2/S3平均约140天，则S4自7/3起下一赛季大致落在11月下旬。该预测置信度低，具体以官方预告为准。',status:'周期预测'});
    updateRow('section-identityv','第四十五赛季',{status:'已上线'});
    updateRow('section-identityv','第四十六赛季',{focus:'近13个完整赛季平均约69.6天、中位数70天，整体约10周一轮；第四十五赛季已于9/10开启，据此第四十六赛季预测约11/19，具体以官宣为准。'});
    updateRow('section-roco','圣龙宝藏',{time:'预计 2026/11/5',name:'S5 下一赛季（爆料名「圣龙宝藏」）',focus:'S4官方周期至11/5，因此下一赛季窗口预计在11/5前后；「圣龙宝藏」名称、龙系大版本及新地图均来自第三方解包/社区信息，尚未获官方确认。',status:'未证实爆料'});
    updateRow('section-golden','下一赛季',{time:'预计 2026/12月上旬',focus:'S18于8/20开启；结合金铲铲手游历史主赛季约4个月的节奏，以及TFT Set 19在12月赛事前上线的官方窗口，下一赛季暂估12月上旬，具体日期待金铲铲官方确认。',status:'周期预测'});
    updateRow('section-delta','S12 下一赛季',{time:'预计 2026/11/14',focus:'近10个完整赛季平均约70.8天、中位数约73.5天，整体约2～2.5个月一轮；S11于9/4开启，据此S12预测约11月中旬，11/14仅作为周期参考点，具体以官宣为准。'});
    removeRow('section-delta','二洲年庆');
    updateRow('section-yanyun','杭州后续重磅更新',{time:'2026/9/24',name:'新版本「平澜起风波」',focus:'9/24新版本已官宣，重点关注杭州后续主章剧情、平澜书院等新内容，以及新增区域、玩法与系统调整。',status:'已官宣'});
    addRow('section-yimeng',{time:'时间未定',name:'经典服势力战',type:'版本节点',focus:'官方已透露经典服势力战进入预研，具体上线时间与规则待定；重点关注势力对抗规则、阵营生态及是否形成长期赛季化玩法。',status:'官方预告'});
    addRow('section-yimeng',{time:'2026年下半年',name:'全新「江湖邪修」体系',type:'版本节点',focus:'官方下半年规划已公开该体系，具体上线版本与完整规则待后续公布；重点关注新身份/成长体系及对长期生态的影响。',status:'官方预告'});
  }
  apply(); setTimeout(apply,300); setTimeout(apply,1200); setTimeout(apply,3000);
  if(typeof renderEditableNodes==='function'){
    const prev=renderEditableNodes;
    renderEditableNodes=function(){ prev(); setTimeout(apply,0); };
  }
})();
`;
try{
  const res=await fetch(frozen,{cache:'no-store'});
  if(!res.ok) throw new Error('基础页面加载失败 '+res.status);
  let html=await res.text();
  const marker='\n`;\ntry{';
  if(!html.includes(marker)) throw new Error('未找到扩展插入点');
  html=html.replace(marker,'\n'+patch+marker);
  document.open();document.write(html);document.close();
}catch(e){document.getElementById('loading').textContent='页面加载失败：'+e.message;}
})();
</script></body></html>
