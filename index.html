<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="description" content="王者荣耀更新与舆情监控内部日报">
<title>王者荣耀 · 更新与舆情监控</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root {
    color-scheme: light;
    --page: #f3f6fb;
    --surface: #ffffff;
    --surface-soft: #f8faff;
    --ink: #101b38;
    --text: #293754;
    --muted: #6f7d98;
    --line: #dce4f0;
    --line-strong: #cbd6e6;
    --blue: #0b5bd3;
    --blue-soft: #edf4ff;
    --green: #0a9953;
    --green-soft: #f0fbf5;
    --green-line: #a9dfc3;
    --red: #e22d2d;
    --red-soft: #fff5f4;
    --red-line: #f2b8b4;
    --amber: #b86c08;
    --shadow: 0 14px 42px rgba(28, 53, 94, 0.07);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% -180px, rgba(56, 114, 226, 0.1), transparent 440px),
      linear-gradient(180deg, #f8faff 0%, var(--page) 54%, #edf2f8 100%);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .skip-link {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10;
    transform: translateY(-150%);
    padding: 8px 12px;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
  }

  .skip-link:focus { transform: translateY(0); }

  .report {
    width: min(1180px, calc(100% - 32px));
    margin: 28px auto;
    padding: 0 22px 22px;
    overflow: hidden;
    border: 1px solid #dfe7f2;
    border-radius: 18px;
    background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
    box-shadow: var(--shadow);
  }

  .masthead {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    padding: 32px 2px 20px;
    border-bottom: 1px solid var(--line);
  }

  .masthead::after {
    position: absolute;
    bottom: -1px;
    left: 2px;
    width: min(32%, 360px);
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--blue), #5f8ff0);
    content: "";
  }

  .masthead h1 {
    margin: 0;
    color: var(--ink);
    font-size: clamp(25px, 3vw, 34px);
    line-height: 1.22;
    letter-spacing: -0.035em;
  }

  .masthead-meta {
    display: grid;
    flex: 0 0 auto;
    justify-items: end;
    gap: 5px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    text-align: right;
  }

  .date-filter-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .date-control-row {
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .date-select {
    min-width: 156px;
    height: 36px;
    padding: 0 32px 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    outline: none;
    background-color: rgba(255, 255, 255, 0.9);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(28, 53, 94, 0.05), inset 0 1px 0 #fff;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .date-select:hover { border-color: #aebdd3; }
  .date-select:focus-visible {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(11, 91, 211, 0.13), 0 5px 16px rgba(28, 53, 94, 0.05);
  }

  .refresh-note { color: var(--muted); font-size: 11px; }

  .compact-report-nav {
    display: none;
    width: 44px;
    height: 44px;
    place-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.9);
    color: var(--blue);
    font-size: 18px;
    cursor: pointer;
  }

  .compact-report-nav:focus-visible {
    outline: 3px solid rgba(11, 91, 211, 0.16);
    outline-offset: 1px;
  }

  .compact-report-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  .report-nav {
    position: fixed;
    top: 50%;
    z-index: 6;
    display: grid;
    width: 62px;
    height: 82px;
    place-items: center;
    border: 1px solid rgba(156, 176, 207, 0.52);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.5);
    color: var(--blue);
    font-size: 40px;
    opacity: 0.5;
    cursor: pointer;
    box-shadow: 0 12px 32px rgba(28, 53, 94, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    transform: translateY(-50%);
    backdrop-filter: blur(12px);
    transition: opacity 0.18s ease, transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
  }

  .report-nav i {
    line-height: 1;
    -webkit-text-stroke: 0.45px currentColor;
  }

  .report-nav:hover,
  .report-nav:focus-visible {
    opacity: 0.92;
    background: rgba(255, 255, 255, 0.88);
    box-shadow: 0 16px 40px rgba(28, 53, 94, 0.14), inset 0 1px 0 #fff;
    transform: translateY(-50%) scale(1.04);
  }

  .report-nav:focus-visible { outline: 3px solid rgba(11, 91, 211, 0.16); outline-offset: 3px; }
  .report-nav:disabled { opacity: 0.16; cursor: not-allowed; filter: grayscale(0.35); }
  .report-nav:disabled:hover { background: rgba(255, 255, 255, 0.5); transform: translateY(-50%); box-shadow: 0 12px 32px rgba(28, 53, 94, 0.09); }
  .report-nav--prev { left: max(18px, calc(50% - 700px)); }
  .report-nav--next { right: max(18px, calc(50% - 700px)); }

  main { padding-top: 30px; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(115deg, #fbfdff 0%, #f4f8ff 52%, #fbfdff 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 24px rgba(28, 53, 94, 0.04);
  }

  .metric {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 14px;
    min-width: 0;
    padding: 24px 26px;
    transition: background-color 0.18s ease;
  }

  .metric:hover { background: rgba(237, 244, 255, 0.46); }

  .metric + .metric { border-left: 1px solid var(--line); }

  .metric-mark {
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    border-radius: 50%;
    border: 1px solid #dce8fb;
    background: linear-gradient(145deg, #f8fbff, #e4efff);
    color: var(--blue);
    font-size: 21px;
    font-weight: 800;
    box-shadow: 0 7px 18px rgba(11, 91, 211, 0.1), inset 0 1px 0 #fff;
  }

  .metric-mark i { display: block; line-height: 1; }

  .metric-label {
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 13px;
  }

  .metric-value {
    display: block;
    overflow-wrap: anywhere;
    color: var(--blue);
    font-size: clamp(22px, 2.6vw, 31px);
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .metric-value small {
    font-size: 0.58em;
    font-weight: 700;
    letter-spacing: 0;
  }

  .section {
    margin-top: 20px;
    padding: 22px 18px 18px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: linear-gradient(180deg, #ffffff 0%, #fcfdff 100%);
    box-shadow: 0 7px 24px rgba(28, 53, 94, 0.035), inset 0 1px 0 #fff;
  }

  .section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
  }

  .section-heading h2 {
    position: relative;
    margin: 0;
    padding-left: 16px;
    color: var(--ink);
    font-size: 24px;
    line-height: 1.25;
    letter-spacing: -0.02em;
  }

  .section-heading h2::before {
    position: absolute;
    top: 4px;
    bottom: 3px;
    left: 0;
    width: 4px;
    border-radius: 3px;
    background: var(--blue);
    content: "";
  }

  .title-count {
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0;
  }

  .section-note {
    color: var(--muted);
    font-size: 12px;
    text-align: right;
  }

  .brief-report {
    display: grid;
    gap: 14px;
  }

  [hidden] { display: none !important; }

  .brief-section {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: #fff;
    box-shadow: 0 6px 20px rgba(28, 53, 94, 0.03);
    overflow: hidden;
  }

  .brief-section .section-heading {
    margin: 0;
    padding: 19px 20px 15px;
  }

  .brief-section .section-heading h2 small {
    margin-left: 7px;
    color: inherit;
    font-size: inherit;
    font-weight: inherit;
    letter-spacing: inherit;
  }

  .brief-conclusion {
    display: flex;
    gap: 14px;
    align-items: baseline;
    margin: 0 20px 16px;
    padding: 12px 14px;
    border: 1px solid #dce6fa;
    border-radius: 10px;
    background: #f7f9ff;
  }

  .brief-conclusion-label {
    flex: 0 0 auto;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eaf0ff;
    color: var(--blue);
    font-size: 12px;
    font-weight: 800;
    line-height: 1.5;
  }

  .brief-conclusion-copy {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
  }

  .brief-conclusion-copy strong {
    margin-right: 8px;
    color: var(--ink);
    font-size: 15px;
  }

  .brief-row-list { border-top: 1px solid var(--line); }

  .brief-row {
    display: grid;
    grid-template-columns: 72px minmax(170px, 260px) minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    min-height: 62px;
    padding: 13px 20px;
    background: #fff;
  }

  .brief-row + .brief-row { border-top: 1px solid var(--line); }
  .brief-row:hover { background: #fbfcff; }

  .brief-row-lead {
    color: var(--blue);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .brief-row-title {
    color: var(--ink);
    font-size: 14px;
    font-weight: 800;
    line-height: 1.55;
  }

  .brief-row-copy {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.65;
  }

  .brief-row-tag {
    padding: 3px 8px;
    border: 1px solid #c9dafa;
    border-radius: 6px;
    color: var(--blue);
    font-size: 11px;
    font-weight: 800;
    white-space: nowrap;
  }

  .brief-row.starred { background: #fffdf5; }
  .brief-row.starred:hover { background: #fffaf0; }

  .brief-row.starred .brief-row-lead {
    display: inline-flex;
    gap: 7px;
    align-items: center;
    color: #aa6b00;
  }

  .brief-row.starred .brief-row-lead i { color: #f0ad19; font-size: 16px; }
  .brief-row.starred .brief-row-title { color: #8d5700; }
  .brief-row.starred .brief-row-tag { border-color: #dfbb61; color: #9b6500; }

  .focus-card {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(240px, 0.75fr);
    gap: 28px;
    padding: 24px;
    border: 1px solid var(--green-line);
    border-radius: 11px;
    background: linear-gradient(120deg, #f7fff9 0%, #edf9f3 70%, #f8fffb 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 22px rgba(10, 153, 83, 0.05);
    overflow: hidden;
  }

  .focus-card::after {
    position: absolute;
    top: -90px;
    right: -70px;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(68, 190, 125, 0.1), transparent 68%);
    pointer-events: none;
    content: "";
  }

  .focus-title-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 12px;
  }

  .focus-title-row > div { min-width: 0; }

  .focus-icon {
    position: relative;
    z-index: 1;
    display: grid;
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 50%;
    background: linear-gradient(145deg, #18af67, #078947);
    color: #fff;
    font-size: 21px;
    box-shadow: 0 8px 20px rgba(10, 153, 83, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.28);
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    margin-bottom: 10px;
    padding: 4px 10px;
    border: 1px solid currentColor;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    line-height: 1.35;
  }

  .eyebrow.good { color: var(--green); background: #fff; }
  .eyebrow.risk { color: var(--red); background: #fff; }

  .focus-card h3 {
    margin: 0;
    color: var(--green);
    font-size: clamp(25px, 3vw, 36px);
    line-height: 1.2;
    letter-spacing: -0.03em;
  }

  .focus-card p { margin: 0; font-size: 16px; }

  .focus-proof {
    position: relative;
    z-index: 1;
    align-self: stretch;
    padding-left: 28px;
    border-left: 1px solid var(--green-line);
  }

  .proof-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 12px;
  }

  .proof-value {
    margin: 7px 0 5px;
    color: var(--green);
    font-size: clamp(25px, 3vw, 36px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 10px rgba(10, 153, 83, 0.08);
  }

  .proof-note { color: #4b6b5a; font-size: 12px; }

  .risk-panel {
    display: grid;
    grid-template-columns: 190px minmax(0, 1fr);
    margin-top: 14px;
    border: 1px solid var(--red-line);
    border-radius: 11px;
    background: linear-gradient(112deg, #fffafa 0%, #fff3f2 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 7px 20px rgba(226, 45, 45, 0.035);
    overflow: hidden;
  }

  .risk-label {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 8px;
    padding: 20px;
    border-right: 1px solid #f2cbc8;
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(255, 245, 244, 0.42));
  }

  .risk-heading-icon,
  .risk-item-icon {
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(145deg, #f63d3d, #d82020);
    color: #fff;
    box-shadow: 0 6px 16px rgba(226, 45, 45, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .risk-heading-icon { width: 34px; height: 34px; font-size: 17px; }
  .risk-item-icon { width: 30px; height: 30px; font-size: 15px; }

  .risk-label strong { color: var(--red); font-size: 20px; }
  .risk-label > span:not(.risk-heading-icon) { color: #8d5d60; font-size: 12px; }

  .risk-list { margin: 0; padding: 6px 18px; list-style: none; display: flex; flex-direction: column; justify-content: center; }

  .risk-item {
    display: grid;
    grid-template-columns: 30px minmax(190px, 0.42fr) minmax(0, 1fr) auto;
    gap: 16px;
    align-items: center;
    padding: 15px 0;
  }

  .risk-item + .risk-item { border-top: 1px solid #f2d6d3; }

  .risk-name { color: var(--red); font-weight: 800; }
  .risk-copy { color: #695456; font-size: 13px; }

  .risk-status {
    padding: 3px 9px;
    border: 1px solid rgba(226, 45, 45, 0.28);
    border-radius: 7px;
    background: rgba(255, 255, 255, 0.66);
    color: var(--red);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
  }

  .update-group + .update-group { margin-top: 20px; }

  .update-group-title {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 8px;
    color: var(--blue);
    font-size: 17px;
  }

  .group-index {
    display: inline-grid;
    width: 26px;
    height: 26px;
    place-items: center;
    border-radius: 7px;
    border: 1px solid #dce8fb;
    background: linear-gradient(145deg, #f7faff, #e6f0ff);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 4px 12px rgba(11, 91, 211, 0.07), inset 0 1px 0 #fff;
  }

  .update-table {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    box-shadow: inset 0 1px 0 #fff;
  }

  .update-row {
    display: grid;
    grid-template-columns: minmax(185px, 0.34fr) minmax(0, 1fr) auto;
    min-height: 48px;
    align-items: center;
    transition: background-color 0.18s ease;
  }

  .update-row:hover { background: #f8fbff; }

  .update-row + .update-row { border-top: 1px solid var(--line); }

  .update-name,
  .update-copy,
  .update-tag { padding: 11px 16px; }

  .update-name { color: var(--blue); font-weight: 800; }
  .update-copy { border-left: 1px solid var(--line); color: var(--text); font-size: 13px; }

  .update-tag {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .update-tag::before {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 6px;
    border-radius: 50%;
    background: #8aa5cf;
    vertical-align: 2px;
    content: "";
  }

  .topic-board {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    overflow: hidden;
    box-shadow: inset 0 1px 0 #fff;
  }

  .topic-board-head,
  .topic-row {
    display: grid;
    grid-template-columns: 92px minmax(0, 1fr) minmax(190px, 0.34fr);
    gap: 20px;
    align-items: center;
  }

  .topic-board-head {
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-soft);
    color: var(--muted);
    font-size: 11px;
  }

  .topic-ranking { margin: 0; padding: 0; list-style: none; }

  .topic-row { min-height: 76px; padding: 14px 18px; transition: background-color 0.18s ease; }
  .topic-row + .topic-row { border-top: 1px solid var(--line); }
  .topic-row:hover { background: #f8fbff; }

  .topic-rank {
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border-radius: 8px;
    background: #98a4b6;
    color: #fff;
    box-shadow: 0 5px 12px rgba(73, 91, 122, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }

  .topic-rank small { display: none; }
  .topic-rank strong {
    font-size: 15px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .topic-row:nth-child(1) .topic-rank { background: linear-gradient(145deg, #f04438, #d92d20); }
  .topic-row:nth-child(2) .topic-rank { background: linear-gradient(145deg, #ff8a34, #f15a16); }
  .topic-row:nth-child(3) .topic-rank { background: linear-gradient(145deg, #f6b914, #e89a00); }

  .topic-main strong { display: block; color: var(--ink); font-size: 15px; }
  .topic-main span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .topic-signal { color: var(--blue); font-size: 12px; font-weight: 700; }

  .method-note {
    margin: 16px 2px 0;
    color: var(--muted);
    font-size: 11px;
  }

  .section-rail {
    position: fixed;
    top: auto;
    bottom: calc(50% + 64px);
    left: calc(50% + 610px);
    z-index: 5;
    display: grid;
    width: 132px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.97), rgba(247, 250, 255, 0.95));
    box-shadow: 0 12px 35px rgba(28, 53, 94, 0.09);
    backdrop-filter: blur(12px);
  }

  .section-rail a {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 8px;
    align-items: center;
    min-height: 52px;
    padding: 10px 12px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    text-decoration: none;

          tag: "爆料"
        }
      ],
      changeConclusion: {
        title: "有变化，双主线。",
        copy: "上周价值观争议已降温，切换为："
      },
      changes: [
        {
          name: "蔡文姬剧情边缘化事件",
          state: "热点1",
          copy: "（8/12 新爆发，值得关注）：角色粉组织性刷屏请愿（单日 450+ 条），不满「魏都回不去、江东不带她」的剧情悬空 + 官方二创只带澜不带蔡文姬——目前唯一有组织性、可能破圈的新热点。",
          starred: true
        },
        {
          name: "英雄平衡性争议",
          state: "热点2",
          copy: "热度仍第一（讨论占比 40~47%），但负面率已回落至 20% 附近，属「高讨论、可控」；吐槽集中在刮痧/超标/暗削（如「李白出无双皮肤削 170 护甲」）。"
        },
        {
          name: "整体状态",
          state: "补充",
          copy: "上周「价值观争议」已降温（负面 31.6% → 2~4%）；整体高讨论度、负面可控的平稳偏热状态。"
        }
      ]
    }
  }
};

const escapeHTML = value => String(value)
  .replaceAll("&", "&amp;")
  .replaceAll("<", "&lt;")
  .replaceAll(">", "&gt;")
  .replaceAll('"', "&quot;")
  .replaceAll("'", "&#039;");

const GROUP_ICONS = {
  "公告动态": "bi-megaphone-fill",
  "玩法": "bi-controller",
  "商业化": "bi-tag-fill",
  "运营活动": "bi-gift-fill"
};

const dateKeys = Object.keys(REPORTS).sort();
const dateSelect = document.getElementById("report-date-select");
const briefReport = document.getElementById("brief-report");
const fullReport = document.getElementById("full-report");
const reportTitle = document.getElementById("report-title");
const reportFooter = document.getElementById("report-footer");
const sectionRail = document.getElementById("section-rail");
const previousButtons = [
  document.getElementById("previous-report"),
  document.getElementById("compact-previous-report")
];
const nextButtons = [
  document.getElementById("next-report"),
  document.getElementById("compact-next-report")
];
let currentReportIndex = 0;
let railObserver = null;

const RAIL_ITEMS = {
  brief: [
    { href: "#brief-updates", icon: "bi-megaphone-fill", label: "公告动态" },
    { href: "#brief-changes", icon: "bi-star-fill", label: "今日变化" }
  ],
  full: [
    { href: "#recommendation", icon: "bi-stars", label: "值得关注" },
    { href: "#sentiment", icon: "bi-bar-chart-fill", label: "话题讨论度" },
    { href: "#updates-section", icon: "bi-list-check", label: "更新内容" }
  ]
};

dateSelect.innerHTML = [...dateKeys].reverse().map(key => `
  <option value="${escapeHTML(key)}">${escapeHTML(REPORTS[key].title)}</option>
`).join("");

const configureRail = items => {
  if (railObserver) railObserver.disconnect();
  sectionRail.hidden = items.length === 0;
  sectionRail.innerHTML = items.map((item, index) => `
    <a href="${escapeHTML(item.href)}"${index === 0 ? ' aria-current="true"' : ""}>
      <b aria-hidden="true"><i class="bi ${escapeHTML(item.icon)}"></i></b>
      <span>${escapeHTML(item.label)}</span>
    </a>
  `).join("");

  const railLinks = [...sectionRail.querySelectorAll("a")];
  const railSections = railLinks
    .map(link => document.querySelector(link.getAttribute("href")))
    .filter(Boolean);

  if (!railSections.length) return;
  railObserver = new IntersectionObserver(entries => {
    const visible = entries
      .filter(entry => entry.isIntersecting)
      .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    railLinks.forEach(link => {
      const active = link.getAttribute("href") === `#${visible.target.id}`;
      if (active) link.setAttribute("aria-current", "true");
      else link.removeAttribute("aria-current");
    });
  }, { rootMargin: "-25% 0px -55% 0px", threshold: [0.05, 0.25, 0.5] });

  railSections.forEach(section => railObserver.observe(section));
};

const renderBriefReport = report => {
  const brief = report.brief;
  const renderConclusion = ({ title, copy }) => `
    <div class="brief-conclusion" role="note">
      <span class="brief-conclusion-label">结论</span>
      <p class="brief-conclusion-copy"><strong>${escapeHTML(title)}</strong>${escapeHTML(copy)}</p>
    </div>
  `;
  const renderRow = ({ lead, title, copy, tag = "", starred = false }) => `
    <article class="brief-row${starred ? " starred" : ""}">
      <span class="brief-row-lead">${starred ? '<i class="bi bi-star-fill" aria-hidden="true"></i>' : ""}${escapeHTML(lead)}</span>
      <strong class="brief-row-title">${escapeHTML(title)}</strong>
      <span class="brief-row-copy">${escapeHTML(copy)}</span>
      ${tag ? `<span class="brief-row-tag">${escapeHTML(tag)}</span>` : ""}
    </article>
  `;

  document.getElementById("brief-update-conclusion").innerHTML = renderConclusion(brief.updateConclusion);
  document.getElementById("brief-change-conclusion").innerHTML = renderConclusion(brief.changeConclusion);

  document.getElementById("brief-update-list").innerHTML = [
    ...brief.updates.map(item => renderRow({
      lead: item.date,
      title: item.title,
      copy: item.copy,
      tag: item.tag
    }))
  ].join("");

  document.getElementById("daily-change-list").innerHTML = brief.changes.map(item => renderRow({
    lead: item.state,
    title: item.name,
    copy: item.copy,
    tag: item.tag,
    starred: item.starred
  })).join("");
};

const renderFullReport = report => {
  document.getElementById("comment-total").textContent = report.totalComments;
  document.getElementById("sentiment-count").textContent = report.totalComments;
  document.getElementById("metric-highlight").textContent = report.metricHighlight;
  document.getElementById("focus-eyebrow").textContent = report.focus.eyebrow;
  document.getElementById("focus-eyebrow").className = `eyebrow ${report.focus.tone || "good"}`;
  document.getElementById("focus-name").textContent = report.focus.name;
  document.getElementById("focus-copy").textContent = report.focus.copy;
  document.getElementById("proof-label").textContent = report.focus.proofLabel;
  document.getElementById("proof-value").textContent = report.focus.proofValue;
  document.getElementById("proof-note").textContent = report.focus.proofNote;
  document.getElementById("risk-count").textContent = `${report.risks.length}项重点关注`;

  document.getElementById("risk-list").innerHTML = report.risks.map(item => `
    <li class="risk-item">
      <span class="risk-item-icon" aria-hidden="true"><i class="bi bi-exclamation-lg"></i></span>
      <span class="risk-name">${escapeHTML(item.name)}</span>
      <span class="risk-copy">${escapeHTML(item.copy)}</span>
      <span class="risk-status">${escapeHTML(item.status)}</span>
    </li>
  `).join("");

  document.getElementById("updates").innerHTML = report.updates.map((group, index) => `
    <section class="update-group" aria-labelledby="update-group-${index}">
      <h3 class="update-group-title" id="update-group-${index}">
        <span class="group-index" aria-hidden="true"><i class="bi ${GROUP_ICONS[group.title] || "bi-list-check"}"></i></span>${escapeHTML(group.title)}
      </h3>
      <div class="update-table">
        ${group.rows.map(row => `
          <div class="update-row">
            <span class="update-name">${escapeHTML(row.name)}</span>
            <span class="update-copy">${escapeHTML(row.copy)}</span>
            <span class="update-tag">${escapeHTML(row.tag)}</span>
          </div>
        `).join("")}
      </div>
    </section>
  `).join("");

  document.getElementById("topic-ranking").innerHTML = report.topics.map((topic, index) => `
    <li class="topic-row">
      <span class="topic-rank"><small>第</small><strong>${index + 1}</strong></span>
      <span class="topic-main">
        <strong>${escapeHTML(topic.name)}</strong>
        <span>${escapeHTML(topic.focus)}</span>
      </span>
      <span class="topic-signal">${escapeHTML(topic.signal)}</span>
    </li>
  `).join("");
};

const renderReport = report => {
  const isBrief = report.layout === "brief";
  reportTitle.textContent = report.title;
  briefReport.hidden = !isBrief;
  fullReport.hidden = isBrief;

  if (isBrief) {
    renderBriefReport(report);
    configureRail([]);
    reportFooter.innerHTML = "数据来源：王者荣耀官方公告、策划直播及公开讨论整理。<br>说明：本页为每日变化简报，仅记录新增信息与值得关注内容。";
    return;
  }

  renderFullReport(report);
  configureRail(RAIL_ITEMS.full);
  reportFooter.textContent = "评论总量按百条取整，跨平台点赞仅作外部表现参考；未核实爆料不进入正式更新列表。";
};

const updateReportNavigation = () => {
  const previousKey = dateKeys[currentReportIndex - 1];
  const nextKey = dateKeys[currentReportIndex + 1];

  previousButtons.forEach(button => {
    button.disabled = !previousKey;
    button.setAttribute("aria-label", previousKey ? `查看上一期报告：${REPORTS[previousKey].title}` : "没有更早的报告");
    button.title = previousKey ? `上一期 · ${REPORTS[previousKey].title}` : "已经是最早一期";
  });

  nextButtons.forEach(button => {
    button.disabled = !nextKey;
    button.setAttribute("aria-label", nextKey ? `查看下一期报告：${REPORTS[nextKey].title}` : "没有更新的报告");
    button.title = nextKey ? `下一期 · ${REPORTS[nextKey].title}` : "已经是最新一期";
  });
};

const showReport = (index, { announce = true, updateUrl = true, scroll = true } = {}) => {
  if (index < 0 || index >= dateKeys.length) return;
  currentReportIndex = index;
  const key = dateKeys[index];
  const report = REPORTS[key];

  renderReport(report);
  dateSelect.value = key;
  document.title = `${report.title} · 王者荣耀`;
  updateReportNavigation();

  if (updateUrl) {
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("date", key);
      window.history.replaceState({}, "", url);
    } catch (error) {
      /* file:// 预览不支持改写地址时，不影响切换功能。 */
    }
  }

  if (announce) document.getElementById("report-change-status").textContent = `已切换至${report.title}`;
  if (scroll) window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
};

previousButtons.forEach(button => button.addEventListener("click", () => showReport(currentReportIndex - 1)));
nextButtons.forEach(button => button.addEventListener("click", () => showReport(currentReportIndex + 1)));
dateSelect.addEventListener("change", event => showReport(dateKeys.indexOf(event.target.value)));

document.addEventListener("keydown", event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (document.activeElement?.closest("a, button, input, select, textarea, [contenteditable='true'], [role='button']")) return;
  if (event.key === "ArrowLeft" && currentReportIndex > 0) showReport(currentReportIndex - 1);
  if (event.key === "ArrowRight" && currentReportIndex < dateKeys.length - 1) showReport(currentReportIndex + 1);
});

const requestedDate = new URLSearchParams(window.location.search).get("date");
const initialReportIndex = dateKeys.includes(requestedDate) ? dateKeys.indexOf(requestedDate) : dateKeys.length - 1;
showReport(initialReportIndex, { announce: false, updateUrl: Boolean(requestedDate && !dateKeys.includes(requestedDate)), scroll: false });
</script>
</body>
</html>
