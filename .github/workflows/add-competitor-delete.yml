name: Add competitor delete action
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-competitor-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('competitor-monitor-editable.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const addonB64='([^']+)';", s)
          if not m: raise SystemExit('addonB64 not found')
          addon=base64.b64decode(m.group(1)).decode('utf-8')
          marker='/* competitor-delete-v1 */'
          patch=base64.b64decode('').decode('utf-8')
          if marker not in addon:
              addon += patch
          b64=base64.b64encode(addon.encode('utf-8')).decode('ascii')
          s=s[:m.start(1)]+b64+s[m.end(1):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit result
        run: |
          rm .github/workflows/add-competitor-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor-monitor-editable.html .github/workflows/add-competitor-delete.yml
          git commit -m "Add delete action to competitor edit row"
          git push origin main
