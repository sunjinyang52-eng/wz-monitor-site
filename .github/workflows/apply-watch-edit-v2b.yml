name: Apply watch edit v2b
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-edit-v2b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch
        shell: bash
        run: |
          echo '' | base64 -d >/tmp/patch.py
          python /tmp/patch.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitor-monitor-editable.html .github/workflows/refresh-monitor-snapshot.yml
          git commit -m 'Add shared editable watch highlights' || exit 0
          git push origin main
