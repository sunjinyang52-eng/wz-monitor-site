name: Apply weekly Lumi focus and delete fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-weekly-lumi-and-delete-fix.yml'
      - 'tools/apply_weekly_lumi_fix.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/apply_weekly_lumi_fix.py
      - name: Commit page patch and refresh snapshot
        shell: bash
        run: |
          printf 'Refresh marker for monitor snapshot. Update this file when an on-demand snapshot refresh is needed.\nLast requested refresh: 2026-09-15 10:50 CST\n' > refresh-monitor-snapshot.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitor-monitor-editable.html refresh-monitor-snapshot.txt
          git commit -m 'Add Lumi weekly focus and fix delete action'
          git push origin main
