name: Apply watch edit v2c
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-edit-v2c.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply existing patch script to page only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          src=Path('.github/workflows/apply-watch-edit-v2b.yml').read_text(encoding='utf-8')
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d >/tmp/patch\.py",src)
          if not m:
              raise SystemExit('embedded patch not found')
          Path('/tmp/patch.py').write_bytes(base64.b64decode(m.group(1)))
          PY
          python /tmp/patch.py
          git restore .github/workflows/refresh-monitor-snapshot.yml
      - name: Commit page only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitor-monitor-editable.html
          if git diff --cached --quiet; then
            echo 'No page changes needed.'
            exit 0
          fi
          git commit -m 'Add shared editable watch highlights'
          git push origin main
