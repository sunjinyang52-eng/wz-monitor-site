name: Patch Delta Force monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-delta.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch monitor page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('competitor-monitor-editable.html')
          s = p.read_text(encoding='utf-8')
          nav_anchor = '      <a href="#section-golden"><span class="nav-dot"></span>金铲铲之战</a>'
          nav = '      <a href="#section-delta"><span class="nav-dot"></span>三角洲行动</a>'
          if nav not in s:
              s = s.replace(nav_anchor, nav_anchor + '\n' + nav)
          lines = [
              '',
              '  <section class="card node-card" id="section-delta">',
              '    <div class="card-head"><div class="node-head-copy"><div class="title">9. 三角洲行动 · 版本节点 / 重点联动</div><div class="node-sub">重点看当前主赛季、下一赛季窗口和已释放的联动线索；性质未明的官方预告单独说明。</div></div><div class="meta"><span>截至 2026/9/8</span></div></div>',
              '    <div class="table-wrap"><table class="node-table"><thead><tr><th>时间</th><th>节点名称</th><th>类型</th><th>重点关注</th><th>信息状态</th></tr></thead><tbody>',
              '      <tr><td class="time">2026/9/4</td><td class="node-name">S11「群星」赛季</td><td><span class="node-type version">版本节点</span></td><td class="node-copy">当前主赛季，新干员、地图重做及多项新玩法集中上线，保留作为现阶段版本背景。</td><td><span class="node-status confirmed">已上线</span></td></tr>',
              '      <tr><td class="time">预计 2026/11/5</td><td class="node-name">S12 下一赛季</td><td><span class="node-type version">版本节点</span></td><td class="node-copy">按 S11 公开周期推算，下一赛季预计11月初切换，主题与具体内容尚未公布。</td><td><span class="node-status predicted">周期预测</span></td></tr>',
              '      <tr><td class="time">时间未定</td><td class="node-name">三角洲行动 × INART</td><td><span class="node-type collab">重点联动</span></td><td class="node-copy">双方已正式官宣合作，后续合作形式与具体产品信息尚未公布。</td><td><span class="node-status preview">官方预告</span></td></tr>',
              '      <tr><td class="time">至 2026/9/21</td><td class="node-name">三角洲行动 ×《逆战：未来》</td><td><span class="node-type collab">重点联动</span></td><td class="node-copy">当前仍在持续的跨游戏联动，属于已上线旧联动，保留到结束时间便于领导判断当前合作动作。</td><td><span class="node-status confirmed">已上线</span></td></tr>',
              '      <tr><td class="time">时间未定</td><td class="node-name">神秘预告「各位_____，好久不见！」</td><td><span class="node-type collab">重点联动</span></td><td class="node-copy">官方已发布神秘预告，但尚未确认是否为联动或具体合作对象，作为潜在线索继续跟踪。</td><td><span class="node-status preview">官方预告</span></td></tr>',
              '    </tbody></table></div>',
              '  </section>'
          ]
          section = '\n'.join(lines)
          if 'id="section-delta"' not in s:
              marker = '    </main>'
              i = s.rfind(marker)
              if i < 0:
                  raise SystemExit('main closing tag not found')
              s = s[:i] + section + '\n' + s[i:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-delta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor-monitor-editable.html .github/workflows/patch-delta.yml
          git commit -m "Add Delta Force future version and collaboration nodes"
          git push origin main