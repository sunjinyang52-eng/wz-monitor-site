name: Apply monitor copy refresh
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-monitor-copy-refresh.yml'
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared monitor copy
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime, re
          from pathlib import Path

          loader=Path('competitor-monitor-editable.html').read_text(encoding='utf-8')
          bm=re.search(r"const base='([^']+)'",loader)
          base_html=urllib.request.urlopen(bm.group(1),timeout=30).read().decode('utf-8')
          url=re.search(r"const SUPABASE_URL='([^']+)'",base_html).group(1)
          key=re.search(r"const SUPABASE_KEY='([^']+)'",base_html).group(1)
          table=re.search(r"const TABLE='([^']+)'",base_html).group(1)
          base=url+'/rest/v1/'+table
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'}

          def call(u,method='GET',body=None):
              data=None if body is None else json.dumps(body,ensure_ascii=False).encode('utf-8')
              req=urllib.request.Request(u,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  text=r.read().decode('utf-8')
                  return json.loads(text) if text else None

          rows=call(base+'?select=*')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()

          def upsert_base_node(section, original_name, time_text, display_name, focus_text, status):
              node_key='__NODE_EDIT__:'+section+':base:'+urllib.parse.quote(original_name,safe="-_.!~*'()")
              payload={
                  'game_name':node_key,
                  'service_group':'综合参考',
                  'service_type':'版本节点',
                  'reason':focus_text,
                  'focus':False,
                  'level':'C',
                  'event_time':time_text,
                  'note':'[[NODEJSON]]'+json.dumps({'name':display_name,'status':status,'deleted':False},ensure_ascii=False,separators=(',',':')),
                  'sort_order':9999,
                  'updated_at':now
              }
              if any(r.get('game_name')==node_key for r in rows):
                  call(base+'?game_name=eq.'+urllib.parse.quote(node_key,safe=''),'PATCH',payload)
              else:
                  call(base,'POST',payload)
              return node_key

          peace_key=upsert_base_node(
              'section-peace','「激战金秋」版本','2026/9/2','「金秋龙狮城」版本',
              '主题海岛回归龙狮城，新增舞龙、醒狮双载具，并同步更新地铁逃生、超体对抗，是9月核心大版本。','已上线')

          yuanmeng_key=upsert_base_node(
              'section-yuanmeng','新赛季「妙笔生花」','2026/9/11','新赛季「妙笔生花」',
              '奇迹农场耕种、垂钓、建造焕新，并上线繁花奇育、元宝雨等内容，重点观察模拟经营与长期留存玩法强化。','已官宣')

          after=call(base+'?select=*')
          latest={}
          for r in after:
              k=r.get('game_name')
              if k in (peace_key,yuanmeng_key):
                  if k not in latest or str(r.get('updated_at') or '')>str(latest[k].get('updated_at') or ''):
                      latest[k]=r
          if peace_key not in latest or '舞龙' not in str(latest[peace_key].get('reason') or ''):
              raise SystemExit('peace verification failed')
          if yuanmeng_key not in latest or '繁花奇育' not in str(latest[yuanmeng_key].get('reason') or ''):
              raise SystemExit('yuanmeng verification failed')
          print('OK')
          PY
