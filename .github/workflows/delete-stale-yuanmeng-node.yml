name: Delete stale Yuanmeng mystery collab node
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-stale-yuanmeng-node.yml'
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write shared tombstone
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, re
          from pathlib import Path
          wf=Path('.github/workflows/refresh-monitor-snapshot.yml').read_text(encoding='utf-8')
          url=re.search(r"SUPABASE_URL='([^']+)'",wf).group(1)+'/rest/v1/competitors'
          key=re.search(r"SUPABASE_KEY='([^']+)'",wf).group(1)
          H={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'}
          def req(method,u,payload=None):
              data=None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              r=urllib.request.Request(u,data=data,headers=H,method=method)
              with urllib.request.urlopen(r,timeout=30) as resp:
                  raw=resp.read().decode('utf-8')
                  return json.loads(raw) if raw else None
          rows=req('GET',url+'?select=id,game_name,note,event_time,service_type,reason') or []
          target_name='谁是狼人 · 神秘联动角色'
          found=[]
          for r in rows:
              if not str(r.get('game_name') or '').startswith('__NODE_EDIT__:section-yuanmeng:'):
                  continue
              raw=str(r.get('note') or '')
              if raw.startswith('[[NODEJSON]]'):
                  try:
                      d=json.loads(raw[12:])
                      if d.get('name')==target_name:
                          found.append(r)
                  except Exception:
                      pass
          if found:
              for r in found:
                  payload={
                    'note':'[[NODEJSON]]'+json.dumps({'name':target_name,'status':'官方预告','deleted':True},ensure_ascii=False),
                    'event_time':r.get('event_time') or '时间未定',
                    'service_type':r.get('service_type') or '重点联动',
                    'reason':r.get('reason') or ''
                  }
                  req('PATCH',url+'?id=eq.'+str(r['id']),payload)
          else:
              safe="-_.!~*'()"
              node_key='__NODE_EDIT__:section-yuanmeng:base:'+urllib.parse.quote(target_name,safe=safe)
              payload={
                'game_name':node_key,'service_group':'综合参考','service_type':'重点联动','reason':'',
                'focus':False,'level':'C','event_time':'时间未定',
                'note':'[[NODEJSON]]'+json.dumps({'name':target_name,'status':'官方预告','deleted':True},ensure_ascii=False),
                'sort_order':30000
              }
              req('POST',url,payload)
          print('deleted',target_name)
          PY
