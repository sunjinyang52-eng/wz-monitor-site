name: Apply approved node updates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-approved-node-updates.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update shared monitor nodes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          cfg=Path('.github/workflows/refresh-monitor-snapshot.yml').read_text(encoding='utf-8')
          base=re.search(r"SUPABASE_URL='([^']+)'",cfg).group(1)+'/rest/v1/competitors'
          key=re.search(r"SUPABASE_KEY='([^']+)'",cfg).group(1)
          headers={'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'}

          def get_latest(game_name):
              qs=urllib.parse.urlencode({'select':'*','game_name':'eq.'+game_name,'order':'updated_at.desc','limit':'1'})
              req=urllib.request.Request(base+'?'+qs,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=30) as r:
                  arr=json.loads(r.read().decode())
              return arr[0] if arr else None

          def upsert_by_key(game_name,payload):
              cur=get_latest(game_name)
              body=json.dumps(payload,ensure_ascii=False).encode('utf-8')
              if cur:
                  qs=urllib.parse.urlencode({'id':'eq.'+str(cur['id'])})
                  req=urllib.request.Request(base+'?'+qs,data=body,headers=headers,method='PATCH')
              else:
                  req=urllib.request.Request(base,data=body,headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=30) as r:
                  r.read()

          honor_key='__NODE_EDIT__:section-honor:base:'+urllib.parse.quote('S45 新赛季「长安雾山」',safe="-_.!~*'()")
          upsert_by_key(honor_key,{
              'game_name':honor_key,
              'service_group':'节点编辑','service_type':'版本节点',
              'reason':'新赛季开启，关注新英雄、地图机制、排位规则和赛季玩法变化。',
              'focus':True,'level':'C','event_time':'预计 2026/9/24',
              'note':'[[NODEJSON]]'+json.dumps({'name':'S45 新赛季「月照长安」','status':'周期预测','deleted':False},ensure_ascii=False),
              'sort_order':9999
          })

          delta_key='__NODE_EDIT__:section-delta:new:20260915-anniversary'
          upsert_by_key(delta_key,{
              'game_name':delta_key,
              'service_group':'节点编辑','service_type':'版本节点',
              'reason':'二洲年活动已开启，9月25–26日线下庆典承接周年节点，9月26日起开放3900限时三角券等奖励，重点观察周年福利与回流拉活。',
              'focus':True,'level':'C','event_time':'2026/9/11 起',
              'note':'[[NODEJSON]]'+json.dumps({'name':'二洲年庆','status':'已上线','deleted':False},ensure_ascii=False),
              'sort_order':9999
          })
          PY
      - name: Trigger snapshot refresh
        shell: bash
        run: |
          printf 'Refresh marker for monitor snapshot. Update this file when an on-demand snapshot refresh is needed.\nLast requested refresh: 2026-09-15 10:20 CST\n' > refresh-monitor-snapshot.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add refresh-monitor-snapshot.txt
          git commit -m 'Refresh snapshot after approved node updates'
          git push origin main
