name: Apply watch edit v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-watch-edit-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch monitor page and snapshot reader
        shell: bash
        run: |
          echo 'Cgo=' >/tmp/placeholder
          echo '__B64__' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitor-monitor-editable.html .github/workflows/refresh-monitor-snapshot.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Add shared editable watch highlights'
          git push origin main
