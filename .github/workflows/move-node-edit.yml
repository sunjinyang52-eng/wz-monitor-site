name: Move node edit buttons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/move-node-edit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move edit button to status column
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p=Path('competitor-monitor-editable.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const addonB64='([^']+)';",s)
          if not m: raise SystemExit('addonB64 not found')
          addon=base64.b64decode(m.group(1)).decode('utf-8')
          old="function applyNodeRow(tr,d){const c=tr.children;c[0].textContent=d.time||'';c[1].innerHTML='<span class=\"node-label\">'+esc(d.name||'')+'</span><button class=\"btn small node-edit-btn\" type=\"button\">编辑</button>';c[2].innerHTML='<span class=\"node-type '+nodeTypeClass(d.type)+'\">'+esc(d.type)+'</span>';c[3].textContent=d.focus||'';c[4].innerHTML='<span class=\"node-status '+nodeStatusClass(d.status)+'\">'+esc(d.status)+'</span>';tr.dataset.nodeRecordId=d.id||'';tr.querySelector('.node-edit-btn').onclick=()=>openNodeModal(tr.closest('.node-card'),tr)}"
          new="function applyNodeRow(tr,d){const c=tr.children;c[0].textContent=d.time||'';c[1].innerHTML='<span class=\"node-label\">'+esc(d.name||'')+'</span>';c[2].innerHTML='<span class=\"node-type '+nodeTypeClass(d.type)+'\">'+esc(d.type)+'</span>';c[3].textContent=d.focus||'';c[4].innerHTML='<div class=\"node-status-actions\"><span class=\"node-status '+nodeStatusClass(d.status)+'\">'+esc(d.status)+'</span><button class=\"btn small node-edit-btn\" type=\"button\">编辑</button></div>';tr.dataset.nodeRecordId=d.id||'';tr.querySelector('.node-edit-btn').onclick=()=>openNodeModal(tr.closest('.node-card'),tr)}"
          if old not in addon: raise SystemExit('applyNodeRow target not found')
          addon=addon.replace(old,new,1)
          oldcss='.node-edit-btn{margin-left:8px;opacity:.28;transition:.16s}'
          newcss='.node-status-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}.node-edit-btn{margin-left:auto;opacity:.28;transition:.16s}'
          if oldcss not in addon: raise SystemExit('style target not found')
          addon=addon.replace(oldcss,newcss,1)
          b64=base64.b64encode(addon.encode('utf-8')).decode('ascii')
          s=s[:m.start(1)]+b64+s[m.end(1):]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/move-node-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor-monitor-editable.html .github/workflows/move-node-edit.yml
          git commit -m "Move node edit buttons to status column"
          git push origin main
