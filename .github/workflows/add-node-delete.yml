name: Patch node delete
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Fix node delete patch workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch page
        run: python patch_node_delete.py
      - name: Commit result
        run: |
          rm patch_node_delete.py .github/workflows/add-node-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitor-monitor-editable.html patch_node_delete.py .github/workflows/add-node-delete.yml
          git commit -m "Add delete action for editable version nodes"
          git push origin main
