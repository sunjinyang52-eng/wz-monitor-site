name: Apply three day watch summary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-three-day-watch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add collapsible three day watch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('competitor-monitor-editable.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const addonB64='([^']+)';",s)
          if not m: raise SystemExit('addonB64 not found')
          addon=base64.b64decode(m.group(1)).decode('utf-8')
          marker='/* three-day-watch-v1 */'
          snippet=base64.b64decode('').decode('utf-8')
          if marker not in addon:
              addon += snippet
              enc=base64.b64encode(addon.encode('utf-8')).decode('ascii')
              s=s[:m.start(1)]+enc+s[m.end(1):]
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit summary panel
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add competitor-monitor-editable.html
          if git diff --cached --quiet; then echo 'No changes needed.'; exit 0; fi
          git commit -m 'Add collapsible three day watch summary'
          git push origin main
