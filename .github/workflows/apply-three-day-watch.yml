name: Apply three day watch summary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-three-day-watch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add collapsible three day watch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64
          p=Path('competitor-monitor-editable.html')
          s=p.read_text(encoding='utf-8')
          m=re.search(r"const addonB64='([^']+)';",s)
          if not m:
              raise SystemExit('addonB64 not found')
          addon=base64.b64decode(m.group(1)).decode('utf-8')
          marker='/* three-day-watch-v1 */'
          snippet=base64.b64decode('Ci8qIHRocmVlLWRheS13YXRjaC12MSAqLwooZnVuY3Rpb24oKXsKICBjb25zdCBzdHlsZT1kb2N1bWVudC5jcmVhdGVFbGVtZW50KCdzdHlsZScpOwogIHN0eWxlLnRleHRDb250ZW50PWAuIHRvX3JlcGxhY2VfY29tcGFjdCBzdHlsZWA7Cn0pKCk7').decode('utf-8')
          PY
